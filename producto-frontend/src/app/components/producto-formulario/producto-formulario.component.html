<h2>{{ producto ? 'Editar Producto' : 'Registrar Producto' }}</h2>

<form [formGroup]="productoForm" (ngSubmit)="guardarProducto()">

  <div>
    <label>Nombre:</label>
    <input type="text" formControlName="nombre">

    <div
      class="mensaje-error"
      *ngIf="productoForm.get('nombre')?.invalid && productoForm.get('nombre')?.touched">
      El nombre es obligatorio
    </div>
  </div>

  <div>
    <label>Descripción:</label>
    <input type="text" formControlName="descripcion">

    <div
      class="mensaje-error"
      *ngIf="productoForm.get('descripcion')?.invalid && productoForm.get('descripcion')?.touched">
      La descripción es obligatoria
    </div>
  </div>

  <div>
    <label>Cantidad:</label>
    <input type="number" formControlName="cantidad">

    <div
      class="mensaje-error"
      *ngIf="productoForm.get('cantidad')?.invalid && productoForm.get('cantidad')?.touched">
      La cantidad no puede ser negativa
    </div>
  </div>

  <div>
    <label>Precio:</label>
    <input type="number" formControlName="precio">

    <div
      class="mensaje-error"
      *ngIf="productoForm.get('precio')?.invalid && productoForm.get('precio')?.touched">
      El precio debe ser mayor a 0
    </div>
  </div>

  <div class="mensaje-error" *ngIf="mensajeError">
    {{ mensajeError }}
  </div>

  <br>

  <button type="submit">
    {{ producto ? 'Actualizar' : 'Guardar' }}
  </button>

</form>
